<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/css/brainboiled.css">
<!-- Planches d'identité des applis : servir le dépôt en local puis ouvrir /tools/identite.html?app=flowday&p=1 (p = 1 à 5) en 1080 x 1080 -->
<style>
html,body{margin:0}body{width:1080px;height:1080px;overflow:hidden;background:var(--app-fond);background-image:none;font-family:var(--font-brand)}
.pg{position:relative;width:1080px;height:1080px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--app-texte);
 background:radial-gradient(900px 700px at 80% 0%,color-mix(in srgb,var(--app-surface) 90%,transparent),transparent 70%),linear-gradient(180deg,var(--app-fond),var(--app-fond-2))}
.deco{position:absolute;inset:0;pointer-events:none}
.ico{border-radius:22.5%;box-shadow:0 30px 80px rgba(0,0,0,.45);position:relative}
.name{font-family:var(--app-titre);font-weight:var(--app-titre-graisse);text-transform:var(--app-titre-casse);letter-spacing:var(--app-titre-espace);line-height:1;margin:0;position:relative}
.name.acc{color:var(--app-accent)}
.tag{font-size:44px;font-weight:600;margin:24px 0 0;position:relative}
.by{position:absolute;bottom:48px;left:0;right:0;text-align:center;font-size:24px;color:var(--app-gris);font-weight:500}
.by b{color:var(--app-texte)}
.h{position:absolute;top:64px;left:72px;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--app-gris);font-weight:700}
.row{display:flex;align-items:center;gap:44px;position:relative}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:936px;position:relative;margin-top:40px}
.sw div{border-radius:24px;height:190px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;font-size:22px;font-weight:700;border:1px solid var(--app-trait)}
.sw small{font-weight:500;font-size:19px;opacity:.85}
.typo{width:936px;margin-top:56px;position:relative}
.typo .t1{font-family:var(--app-titre);font-weight:var(--app-titre-graisse);text-transform:var(--app-titre-casse);letter-spacing:var(--app-titre-espace);font-size:84px;line-height:1.05;color:var(--app-accent)}
.typo .t2{font-size:30px;color:var(--app-gris);margin-top:14px}
</style></head><body><script>
const A={
 flowday:{n:'FlowDay',t:'Pas tout. Juste maintenant.',f:'Nunito ExtraBold',hi:192,c:[['Soleil','#FFC438'],['Canard','#17596D'],['Canard profond','#123F4E'],['Canard nuit','#0B2A35'],['Blanc','#F5FAFB'],['Turquoise','#7FD3E3']]},
 diafra:{n:'Diafra',t:'Apprendre la photo',f:'Roboto Bold',hi:1024,c:[['Or','#F0C454'],['Jaune collimateur','#FFC400'],['Sable','#E8E0D0'],['Brun chaud','#3A2C12'],['Brun profond','#16110A'],['Or des titres','#F0C860']]},
 origins:{n:'Origins',t:"Refais l'histoire, recette par recette",f:'IM Fell English',hi:1024,c:[['Or gravé','#D9B25F'],['Or étoile','#F4CD52'],['Parchemin','#EFE6D3'],['Nuit bleue','#151A33'],['Nuit cosmique','#0B0E1C'],['Lavande stellaire','#AEB8E6']]},
 morsetree:{n:'MorseTree',t:'Traducteur morse',f:'Rajdhani Bold',hi:512,c:[['Diode verte','#3DDC84'],['Diode rouge','#E5484D'],['Or antenne','#E6C56F'],['Graphite clair','#1B2130'],['Graphite','#11151E'],['Blanc écran','#EDEFF2']]},
 ringwise:{n:'RingWise',t:'Score & Coach',f:'Barlow Condensed Bold',hi:1024,c:[['Mouche','#FF6A2B'],['Orange appli','#D9480F'],['Crème carton','#F3F0E4'],['Charbon clair','#222830'],['Charbon','#161A20'],['Vert stand','#2B7A4B']]}};
const q=new URLSearchParams(location.search),k=q.get('app'),p=+q.get('p'),a=A[k];document.body.dataset.app=k;
const ic=`/assets/apps/${k}-icon-${a.hi}.png`;
const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(x=>x<=.03928?x/12.92:((x+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const deco={
 flowday:`<svg class=deco viewBox="0 0 1080 1080"><path d="M-80 760 C 240 1000, 520 1120, 900 1180 L 700 1180 C 400 1150, 120 1040, -80 900 Z" fill="#FFC438" opacity=".9"/><path d="M-80 640 C 260 920, 620 1080, 1000 1160 L 900 1180 C 520 1120, 240 1000, -80 760 Z" fill="#7FD3E3" opacity=".35"/></svg>`,
 diafra:`<svg class=deco viewBox="0 0 1080 1080"><defs><radialGradient id=g cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#3A2C12"/><stop offset="1" stop-color="#3A2C12" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1080" fill="url(#g)"/><circle cx="540" cy="450" r="470" fill="none" stroke="#F0C454" stroke-opacity=".12" stroke-width="2"/><circle cx="540" cy="450" r="520" fill="none" stroke="#F0C454" stroke-opacity=".07" stroke-width="2"/></svg>`,
 origins:`<svg class=deco viewBox="0 0 1080 1080">${Array.from({length:90},(_,i)=>{const x=(i*397)%1080,y=(i*733+91)%1080,r=1+(i%4)*.7;return `<circle cx="${x}" cy="${y}" r="${r}" fill="${i%5?'#EFE6D3':'#F4CD52'}" opacity="${.25+(i%3)*.2}"/>`}).join('')}<rect x="36" y="36" width="1008" height="1008" rx="6" fill="none" stroke="#D9B25F" stroke-opacity=".45" stroke-width="2"/><rect x="48" y="48" width="984" height="984" rx="4" fill="none" stroke="#D9B25F" stroke-opacity=".2" stroke-width="1"/></svg>`,
 morsetree:`<svg class=deco viewBox="0 0 1080 1080"><defs><pattern id=gr width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#D0D5DB" stroke-opacity=".06"/></pattern></defs><rect width="1080" height="1080" fill="url(#gr)"/><g transform="translate(250 930)"><rect x="0" width="70" height="20" rx="10" fill="#E5484D"/><rect x="90" width="70" height="20" rx="10" fill="#E5484D"/><circle cx="200" cy="10" r="10" fill="#3DDC84"/><circle cx="240" cy="10" r="10" fill="#3DDC84"/><rect x="280" width="70" height="20" rx="10" fill="#E5484D"/><circle cx="390" cy="10" r="10" fill="#3DDC84"/><circle cx="430" cy="10" r="10" fill="#3DDC84"/><rect x="470" width="70" height="20" rx="10" fill="#E5484D"/><circle cx="570" cy="10" r="10" fill="#3DDC84"/></g></svg>`,
 ringwise:`<svg class=deco viewBox="0 0 1080 1080">${[980,820,660,500].map((r,i)=>`<circle cx="540" cy="470" r="${r/2+260}" fill="none" stroke="#F3F0E4" stroke-opacity="${.05+i*.012}" stroke-width="28"/>`).join('')}</svg>`};
const by=`<div class=by>une appli <b>BrainBoiled</b></div>`;
const pages={
 1:()=>`${deco[k]}<img class=ico src="${ic}" width=330 height=330><p class="name acc" style="font-size:${a.n.length>8?128:150}px;margin-top:56px">${a.n}</p><p class=tag>${a.t}</p>`,
 2:()=>`<div class=h>Icône</div><img class=ico src="${ic}" width=560 height=560>${by}`,
 3:()=>`<div class=h>Logo horizontal</div><div class=row><img class=ico src="${ic}" width=210 height=210><p class="name acc" style="font-size:${a.n.length>8?116:140}px">${a.n}</p></div>${by}`,
 4:()=>`<div class=h>Couleurs et typographie</div><div class=sw>${a.c.map(([n,h])=>`<div style="background:${h};color:${lum(h)>.3?'#10131A':'#FFFFFF'}">${n}<small>${h}</small></div>`).join('')}</div><div class=typo><div class=t1>${a.n} Aa 123</div><div class=t2>Titres : ${a.f} · Texte des sites : Urbanist</div></div>`,
 5:()=>`${deco[k]}<div class=h>Logo empilé</div><img class=ico src="${ic}" width=300 height=300><p class="name acc" style="font-size:${a.n.length>8?120:140}px;margin-top:50px">${a.n}</p>${by}`};
document.body.innerHTML=`<div class=pg>${pages[p]()}</div>`;
</script></body></html>
